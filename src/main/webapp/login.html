<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Khaalo</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main styles for the background layout to render correctly -->
    <style>
/* ============================================
   KHAALO - Food Delivery App Styles
   Har Bhook Ka Solution
   ============================================ */

/* === CSS Custom Properties (Design Tokens) === */
:root {
    /* Brand Colors */
    --primary: #FF6B35;
    --primary-dark: #E85D2C;
    --primary-light: #FF8A5C;
    --primary-glow: rgba(255, 107, 53, 0.35);

    --secondary: #2C1B10;
    --secondary-light: #3D291C;

    --accent: #FFB800;
    --accent-light: #FFD54F;

    /* Warm Appetite-Stimulating Neutrals */
    --bg-primary: #FFF9F2;
    --bg-secondary: #FFF3E0;
    --bg-card: #FFFFFF;
    --bg-card-hover: #FFFDF9;
    --bg-surface: #FFEEDD;
    --bg-glass: rgba(255, 255, 255, 0.88);
    --bg-glass-light: rgba(255, 107, 53, 0.06);

    --text-primary: #2C1B10;
    --text-secondary: #5C4333;
    --text-muted: #8E796A;
    --text-accent: #FF6B35;

    /* Borders */
    --border-subtle: rgba(255, 107, 53, 0.12);
    --border-active: rgba(255, 107, 53, 0.5);

    /* Shadows */
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
    --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.4);
    --shadow-glow: 0 4px 30px var(--primary-glow);

    /* Spacing */
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 16px;
    --space-lg: 24px;
    --space-xl: 32px;
    --space-2xl: 48px;

    /* Radius */
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 24px;
    --radius-full: 9999px;

    /* Transitions */
    --transition-fast: 0.15s ease;
    --transition-base: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-spring: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);

    /* Z-Index layers */
    --z-base: 1;
    --z-sticky: 100;
    --z-nav: 200;
    --z-overlay: 300;
    --z-modal: 400;
    --z-splash: 500;

    /* Layout */
    --nav-height: 72px;
    --header-height: 60px;
    --max-width: 1400px;
}

/* === Reset & Base Styles === */
*,
*::before,
*::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    font-size: 16px;
    scroll-behavior: smooth;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: 'Outfit', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    /* Warm yellow-orange appetite-inducing gradient */
    background:
        radial-gradient(ellipse at 20% 0%, rgba(255, 170, 50, 0.15) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 10%, rgba(255, 120, 30, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 60%, rgba(255, 180, 50, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 90% 90%, rgba(255, 160, 50, 0.05) 0%, transparent 50%),
        linear-gradient(175deg, #FFFDF9 0%, #FFF5E6 30%, #FFE5CC 60%, #FFD9B3 100%);
    background-attachment: fixed;
    color: var(--text-primary);
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

img {
    max-width: 100%;
    height: auto;
    display: block;
}

button {
    border: none;
    background: none;
    cursor: pointer;
    font-family: inherit;
    color: inherit;
    outline: none;
}

input {
    border: none;
    background: none;
    font-family: inherit;
    color: inherit;
    outline: none;
}

a {
    text-decoration: none;
    color: inherit;
}

/* Scrollbar Styling */
::-webkit-scrollbar {
    width: 6px;
    height: 4px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: var(--bg-surface);
    border-radius: var(--radius-full);
}

::-webkit-scrollbar-thumb:hover {
    background: var(--text-muted);
}

/* === Splash Screen === */
.splash-loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--bg-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: var(--z-splash);
    transition: opacity 0.6s ease, visibility 0.6s ease;
}

.splash-loader.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.splash-content {
    text-align: center;
    position: relative;
}

.splash-phase {
    display: none;
    flex-direction: column;
    align-items: center;
    animation: splashFadeIn 0.5s ease forwards;
}

.splash-phase.active {
    display: flex;
}

.splash-logo {
    margin-bottom: var(--space-xl);
}

.splash-icon {
    font-size: 4rem;
    display: block;
    margin-bottom: var(--space-md);
    animation: splashBounce 1.2s ease-in-out infinite;
}

.splash-title {
    font-family: 'Outfit', sans-serif;
    font-size: 3.5rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -1px;
}

.splash-tagline {
    font-family: 'Poppins', sans-serif;
    font-size: 1.1rem;
    color: var(--text-secondary);
    font-weight: 400;
    margin-top: var(--space-xs);
    letter-spacing: 2px;
    text-transform: uppercase;
}

.splash-spinner {
    display: flex;
    justify-content: center;
}

.spinner-ring {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border-subtle);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

/* Splash Location Phase */
.splash-location-pin {
    position: relative;
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: var(--space-lg);
}

.splash-location-pin svg {
    filter: drop-shadow(0 4px 12px rgba(255, 107, 53, 0.35));
    animation: splashPinBob 1s ease-in-out infinite;
}

@keyframes splashPinBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

.splash-loc-pulse {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 2px solid var(--primary);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.5);
    animation: splashLocPulse 1.5s infinite ease-out;
    pointer-events: none;
}

@keyframes splashLocPulse {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.7; }
    100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
}

.splash-loc-status {
    font-family: 'Outfit', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: var(--space-sm);
}

.splash-loc-address {
    font-family: 'Poppins', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text-primary);
    max-width: 320px;
    line-height: 1.4;
    opacity: 0;
    transition: opacity 0.4s ease;
}

.splash-loc-address.visible {
    opacity: 1;
}

@keyframes splashFadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes splashBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* === App Container === */
.app-container {
    width: 100%;
    max-width: var(--max-width);
    margin: 0 auto;
    min-height: 100vh;
    opacity: 0;
    transition: opacity 0.5s ease;
}

.app-container.visible {
    opacity: 1;
}

/* === Top Bar / Header === */
.top-bar {
    position: sticky;
    top: 0;
    z-index: var(--z-sticky);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-md) var(--space-lg);
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-subtle);
    transition: all var(--transition-base);
    height: var(--header-height);
}

.top-bar.scrolled {
    background: var(--bg-glass);
    box-shadow: var(--shadow-md);
}

.menu-btn {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-glass-light);
    color: var(--text-primary);
    transition: all var(--transition-base);
}

.menu-btn:hover {
    background: var(--bg-surface);
    transform: scale(1.05);
}

.menu-btn:active {
    transform: scale(0.95);
}

.delivery-info {
    text-align: left;
    flex: 1;
    padding-right: var(--space-md);
}

.delivery-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 500;
}

.delivery-address {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: var(--space-xs);
    margin-top: 2px;
}

.delivery-address span {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-primary);
}

.notification-btn {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-glass-light);
    color: var(--text-primary);
    position: relative;
    transition: all var(--transition-base);
}

.notification-btn:hover {
    background: var(--bg-surface);
    transform: scale(1.05);
}

.notification-btn:active {
    transform: scale(0.95);
}

.profile-btn {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-glass-light);
    color: var(--text-primary);
    transition: all var(--transition-base);
}

.profile-btn:hover {
    background: var(--bg-surface);
    transform: scale(1.05);
}

.profile-btn:active {
    transform: scale(0.95);
}

.notif-dot {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 8px;
    height: 8px;
    background: var(--primary);
    border-radius: 50%;
    border: 2px solid var(--bg-primary);
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.2); }
}

/* === Hero Section === */
.hero-section {
    position: relative;
    width: auto;
    margin-bottom: var(--space-lg);
    overflow: hidden;
    border-radius: 0 0 var(--radius-xl) var(--radius-xl);
    background: #000;
}

.hero-video-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
}

.hero-video-container video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}

.hero-overlay {
    position: relative;
    width: 100%;
    background: linear-gradient(
        135deg,
        rgba(0, 0, 0, 0.45) 0%,
        rgba(0, 0, 0, 0.65) 50%,
        rgba(0, 0, 0, 0.85) 100%
    );
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-2xl);
    gap: var(--space-2xl);
    min-height: 480px;
}

/* Left Brand Column */
.hero-left-brand {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-md);
    max-width: 45%;
    animation: slideInLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.brand-logo-glow {
    font-size: 3rem;
    animation: floatGlow 3s ease-in-out infinite;
    filter: drop-shadow(0 0 10px var(--primary-glow));
}

@keyframes floatGlow {
    0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 10px rgba(255, 107, 53, 0.4)); }
    50% { transform: translateY(-6px); filter: drop-shadow(0 0 20px rgba(255, 107, 53, 0.7)); }
}

.brand-sub {
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--primary-light);
    letter-spacing: 3px;
    text-transform: uppercase;
}

.brand-title {
    font-family: 'Outfit', sans-serif;
    font-size: 3rem;
    font-weight: 900;
    line-height: 1.15;
    color: #fff;
    margin: 0;
}

/* Right Side Card (Inspired by reference image layout) */
.hero-right-card {
    background: rgba(28, 20, 15, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: var(--radius-xl);
    max-width: 680px;
    width: 60%;
    display: flex;
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    flex-shrink: 0;
}

.hero-card-content {
    flex: 1.2;
    padding: var(--space-xl);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    color: #fff;
    text-align: left;
}

.promo-pill-light {
    display: inline-flex;
    align-items: center;
    background: rgba(255, 107, 53, 0.15);
    border: 1px solid rgba(255, 107, 53, 0.3);
    padding: 6px 12px;
    border-radius: var(--radius-full);
    font-size: 0.7rem;
    font-weight: 700;
    color: #ff9d73;
    margin-bottom: var(--space-md);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.hero-card-slogan {
    font-family: 'Outfit', sans-serif;
    font-size: 2.4rem;
    font-weight: 900;
    line-height: 1.1;
    margin: 0 0 var(--space-sm) 0;
    color: #fff;
}

.slogan-highlight {
    background: linear-gradient(135deg, #ffb088, var(--primary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.hero-card-desc {
    font-size: 0.9rem;
    color: rgba(255, 255, 255, 0.8);
    line-height: 1.4;
    margin: 0 0 var(--space-md) 0;
}

.hero-card-promo-badge {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    margin-bottom: var(--space-lg);
    background: rgba(255, 255, 255, 0.05);
    padding: 8px 16px;
    border-radius: var(--radius-md);
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.promo-percent-bold {
    font-family: 'Outfit', sans-serif;
    font-weight: 900;
    font-size: 1.2rem;
    color: var(--primary-light);
}

.promo-code-pill {
    font-size: 0.75rem;
    font-weight: 700;
    color: #fff;
    background: var(--primary);
    padding: 2px 8px;
    border-radius: 4px;
    letter-spacing: 0.5px;
}

.promo-cta-new {
    display: inline-flex;
    align-items: center;
    gap: var(--space-sm);
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    padding: 12px 28px;
    border-radius: var(--radius-full);
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all var(--transition-base);
    box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
    border: none;
}

.promo-cta-new:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 107, 53, 0.45);
}

.hero-card-image-wrap {
    flex: 1;
    overflow: hidden;
    position: relative;
}

.hero-card-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform var(--transition-slow);
}

.hero-right-card:hover .hero-card-img {
    transform: scale(1.05);
}


/* Floating food emojis */
.floating-food {
    position: absolute;
    z-index: 2;
    font-size: 2rem;
    opacity: 0.4;
    animation: floatAround 8s ease-in-out infinite;
    pointer-events: none;
}

.food-1 {
    top: 15%;
    right: 10%;
    animation-delay: 0s;
}

.food-2 {
    top: 60%;
    right: 5%;
    animation-delay: 2s;
    font-size: 1.5rem;
}

.food-3 {
    bottom: 20%;
    right: 20%;
    animation-delay: 4s;
    font-size: 1.8rem;
}

.food-4 {
    top: 30%;
    right: 25%;
    animation-delay: 6s;
    font-size: 1.3rem;
}

@keyframes floatAround {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }
    25% {
        transform: translateY(-15px) rotate(10deg);
    }
    50% {
        transform: translateY(-5px) rotate(-5deg);
    }
    75% {
        transform: translateY(-20px) rotate(5deg);
    }
}

@keyframes slideInLeft {
    from {
        opacity: 0;
        transform: translateX(-30px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

/* === Search Section === */
.search-section {
    padding: 0 var(--space-lg);
    margin-bottom: var(--space-lg);
    margin-top: calc(-1 * var(--space-md));
    position: relative;
    z-index: 3;
}

.search-wrapper {
    display: flex;
    gap: var(--space-sm);
    align-items: center;
}

.search-bar {
    flex: 1;
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    padding: var(--space-md) var(--space-lg);
    transition: all var(--transition-base);
    box-shadow: var(--shadow-sm);
}

.search-bar:focus-within {
    border-color: var(--border-active);
    box-shadow: 0 0 0 3px var(--primary-glow), var(--shadow-md);
    background: var(--bg-card-hover);
}

.search-icon {
    color: var(--text-muted);
    flex-shrink: 0;
}

.search-bar input {
    flex: 1;
    font-size: 0.9rem;
    color: var(--text-primary);
}

.search-bar input::placeholder {
    color: var(--text-muted);
    font-weight: 400;
}

.filter-btn {
    width: 52px;
    height: 52px;
    border-radius: var(--radius-lg);
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-glow);
    transition: all var(--transition-spring);
    flex-shrink: 0;
}

.filter-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 4px 25px var(--primary-glow);
}

.filter-btn:active {
    transform: scale(0.95);
}

/* === Section Headers === */
.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--space-lg);
    margin-bottom: var(--space-md);
}

.section-header h2 {
    font-family: 'Outfit', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text-primary);
}

.see-all-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--primary);
    font-size: 0.85rem;
    font-weight: 600;
    transition: all var(--transition-base);
}

.see-all-btn:hover {
    color: var(--primary-light);
    gap: 8px;
}

.arrow-btn {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-md);
    background: var(--bg-glass-light);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary);
    transition: all var(--transition-base);
}

.arrow-btn:hover {
    background: var(--primary);
    color: white;
    transform: scale(1.1);
}

/* Mobile See All Button & Desktop Hiding */
.mobile-see-all-container {
    display: none;
    justify-content: center;
    margin: var(--space-md) 0 var(--space-xl);
}

.mobile-see-all-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-card);
    border: 2px solid var(--primary);
    color: var(--primary);
    padding: 10px 24px;
    border-radius: var(--radius-full);
    font-weight: 700;
    font-size: 0.9rem;
    font-family: inherit;
    cursor: pointer;
    transition: all var(--transition-base);
    box-shadow: var(--shadow-sm);
}

.mobile-see-all-btn:hover {
    background: var(--primary);
    color: white;
    box-shadow: 0 4px 15px rgba(255, 107, 53, 0.2);
    transform: translateY(-1px);
}

.mobile-see-all-btn svg {
    transition: transform var(--transition-base);
}

.mobile-see-all-btn:hover svg {
    transform: translateY(2px);
}


/* Show mobile see-all button container for mobile/tablet */
@media screen and (max-width: 768px) {
    .mobile-see-all-container {
        display: flex;
    }
}

/* === Categories Section === */
.categories-section {
    margin-bottom: var(--space-xl);
}

.categories-scroll {
    display: flex;
    gap: var(--space-lg);
    padding: var(--space-sm) var(--space-lg);
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}

.categories-scroll::-webkit-scrollbar {
    display: none;
}

.category-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-sm);
    min-width: 100px;
    scroll-snap-align: start;
    cursor: pointer;
    transition: all var(--transition-spring);
}

.category-card:hover {
    transform: translateY(-4px);
}

.category-card:active {
    transform: scale(0.95);
}

.category-card.active .category-img-wrap {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-glow);
}

.category-card.active .category-name {
    color: var(--primary);
    font-weight: 700;
}

.category-img-wrap {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--border-subtle);
    padding: 4px;
    background: var(--bg-card);
    transition: all var(--transition-base);
    display: flex;
    align-items: center;
    justify-content: center;
}

.category-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
}

.category-img-wrap.biryani-emoji span,
.category-img-wrap.chinese-emoji span,
.category-img-wrap.thali-emoji span,
.category-img-wrap.category-emoji span {
    font-size: 2rem;
}

.category-name {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-secondary);
    text-align: center;
    white-space: nowrap;
    transition: all var(--transition-base);
}

/* === Popular Restaurants Section === */
.popular-section {
    margin-bottom: var(--space-xl);
}

.restaurants-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--space-md);
    padding: 0 var(--space-lg);
}

.restaurant-card {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid var(--border-subtle);
    transition: all var(--transition-base);
    cursor: pointer;
    animation: fadeInUp 0.5s ease both;
    text-decoration: none;
    color: inherit;
    display: block;
}

.restaurant-card:nth-child(1) { animation-delay: 0.1s; }
.restaurant-card:nth-child(2) { animation-delay: 0.2s; }
.restaurant-card:nth-child(3) { animation-delay: 0.3s; }
.restaurant-card:nth-child(4) { animation-delay: 0.4s; }

.restaurant-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
    border-color: var(--border-active);
}

.restaurant-card:active {
    transform: scale(0.98);
}

.restaurant-img-wrap {
    position: relative;
    width: 100%;
    height: 180px;
    overflow: hidden;
}

.restaurant-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
}

.restaurant-card:hover .restaurant-img-wrap img {
    transform: scale(1.05);
}

.restaurant-badge {
    position: absolute;
    top: var(--space-sm);
    left: var(--space-sm);
}

.badge-discount {
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
    background: linear-gradient(135deg, rgba(255, 107, 53, 0.95), rgba(232, 93, 44, 0.95));
    color: white;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    font-size: 0.72rem;
    font-weight: 700;
    backdrop-filter: blur(4px);
    letter-spacing: 0.3px;
}

.fav-btn {
    position: absolute;
    top: var(--space-sm);
    right: var(--space-sm);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(26, 16, 8, 0.6);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    transition: all var(--transition-spring);
}

.fav-btn:hover {
    background: var(--primary);
    transform: scale(1.15);
}

.fav-btn.liked {
    background: var(--primary);
}

.fav-btn.liked svg {
    fill: white;
    animation: heartBeat 0.4s ease;
}

@keyframes heartBeat {
    0% { transform: scale(1); }
    30% { transform: scale(1.3); }
    60% { transform: scale(0.9); }
    100% { transform: scale(1); }
}

.restaurant-info {
    padding: var(--space-md);
}

.restaurant-name-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-xs);
}

.restaurant-name-row h3 {
    font-family: 'Outfit', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text-primary);
}

.restaurant-rating {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-primary);
}

.rating-count {
    color: var(--text-muted);
    font-weight: 400;
    font-size: 0.75rem;
}

.restaurant-meta {
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-bottom: var(--space-sm);
}

.restaurant-tags {
    display: flex;
    gap: var(--space-sm);
    flex-wrap: wrap;
}

.tag {
    font-size: 0.72rem;
    color: var(--text-secondary);
    background: var(--bg-glass-light);
    padding: 4px 10px;
    border-radius: var(--radius-full);
    font-weight: 500;
    border: 1px solid var(--border-subtle);
}

/* === Trending Section === */
.trending-section {
    margin-bottom: var(--space-xl);
}

.trending-scroll {
    display: flex;
    gap: var(--space-md);
    padding: var(--space-sm) var(--space-lg);
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}

.trending-scroll::-webkit-scrollbar {
    display: none;
}

.trending-card,
.recommended-card {
    min-width: 220px;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    scroll-snap-align: start;
    cursor: pointer;
    transition: all var(--transition-base);
}

.trending-card:hover,
.recommended-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
    border-color: var(--border-active);
}

.trending-img,
.recommended-img {
    position: relative;
    width: 100%;
    height: 140px;
    overflow: hidden;
}

.trending-img img,
.recommended-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
}

.trending-card:hover .trending-img img,
.recommended-card:hover .recommended-img img {
    transform: scale(1.1);
}

.trending-info,
.recommended-info {
    padding: var(--space-sm) var(--space-md);
}

.trending-info h4,
.recommended-info h4 {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: var(--space-xs);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.trending-price-row,
.recommended-price-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: var(--space-xs);
}

.trending-price-row .price,
.recommended-price-row .price {
    font-size: 1rem;
    font-weight: 800;
    color: var(--primary);
}

.original-price {
    color: var(--text-muted);
    text-decoration: line-through;
    font-weight: 400;
    font-size: 0.75rem;
    margin-left: 4px;
}

/* === Recommended Section === */
.recommended-section {
    margin-bottom: var(--space-xl);
}

.recommended-scroll {
    display: flex;
    gap: var(--space-md);
    padding: var(--space-sm) var(--space-lg);
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}

.recommended-scroll::-webkit-scrollbar {
    display: none;
}

.recommended-card .rating-badge {
    position: absolute;
    top: var(--space-sm);
    left: var(--space-sm);
    background: rgba(255, 255, 255, 0.95);
    color: #2C1B10;
    padding: 3px 8px;
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
    font-weight: 700;
    box-shadow: var(--shadow-sm);
}

.recommended-price-row .add-to-cart-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    font-size: 1.2rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition-fast);
}

.recommended-price-row .add-to-cart-btn:hover {
    background: var(--primary-dark);
    transform: scale(1.1);
}

/* === Top Restaurants Section === */
.top-restaurants-section {
    margin-bottom: var(--space-xl);
}

.top-restaurants-scroll {
    display: flex;
    gap: var(--space-md);
    padding: var(--space-sm) var(--space-lg);
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}

.top-restaurants-scroll::-webkit-scrollbar {
    display: none;
}

.top-restaurant-card {
    min-width: 280px;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    scroll-snap-align: start;
    cursor: pointer;
    transition: all var(--transition-base);
    text-decoration: none;
    color: inherit;
    display: block;
}

.top-restaurant-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
    border-color: var(--border-active);
}

.top-restaurant-img {
    position: relative;
    width: 100%;
    height: 160px;
    overflow: hidden;
}

.top-restaurant-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
}

.top-restaurant-card:hover .top-restaurant-img img {
    transform: scale(1.1);
}

.top-restaurant-card .promo-badge {
    position: absolute;
    top: var(--space-sm);
    left: var(--space-sm);
    background: var(--primary);
    color: white;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
    font-weight: 700;
    box-shadow: var(--shadow-sm);
}

.top-restaurant-info {
    padding: var(--space-md);
}

.top-restaurant-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2px;
}

.top-restaurant-header h3 {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.top-restaurant-header .rating {
    font-size: 0.9rem;
    font-weight: 700;
    color: #FFA000;
    background: rgba(255, 160, 0, 0.1);
    padding: 2px 6px;
    border-radius: var(--radius-sm);
}

.top-restaurant-info .cuisine {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: var(--space-sm);
}

.top-restaurant-info .meta-row {
    display: flex;
    gap: var(--space-md);
    font-size: 0.8rem;
    color: var(--text-muted);
}

/* === FAQ Section === */
.faq-section {
    max-width: 800px;
    margin: var(--space-2xl) auto;
    padding: 0 var(--space-lg);
}

.faq-accordion {
    display: flex;
    flex-direction: column;
    gap: var(--space-md);
}

.faq-item {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    overflow: hidden;
    transition: all var(--transition-base);
}

.faq-item:hover {
    border-color: var(--border-active);
    box-shadow: var(--shadow-sm);
}

.faq-question {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--space-md) var(--space-lg);
    text-align: left;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text-primary);
    background: none;
    transition: color var(--transition-fast);
}

.faq-question:hover {
    color: var(--primary);
}

.faq-question .chevron-icon {
    color: var(--text-muted);
    transition: transform var(--transition-base);
}

/* Accordion Active States */
.faq-item.active {
    border-color: var(--primary);
    box-shadow: var(--shadow-md);
}

.faq-item.active .faq-question {
    color: var(--primary);
}

.faq-item.active .chevron-icon {
    transform: rotate(180deg);
    color: var(--primary);
}

.faq-answer {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease-out;
}

.faq-answer-content {
    padding: 0 var(--space-lg) var(--space-md);
    color: var(--text-secondary);
    font-size: 0.92rem;
    line-height: 1.6;
}

/* === Bottom Spacer === */
.bottom-spacer {
    height: calc(var(--nav-height) + var(--space-lg));
}

/* === Bottom Navigation === */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: var(--max-width);
    height: var(--nav-height);
    background: var(--bg-glass);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 var(--space-sm);
    z-index: var(--z-nav);
    transition: transform 0.3s ease;
}

.bottom-nav.hidden {
    transform: translateX(-50%) translateY(100%);
}

.nav-brand-logo {
    display: none;
}

.nav-items-wrapper {
    display: flex;
    width: 100%;
    justify-content: space-around;
    align-items: center;
}

.nav-desktop-actions {
    display: none;
}

.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: var(--space-sm);
    border-radius: var(--radius-md);
    color: var(--text-muted);
    font-size: 0.65rem;
    font-weight: 500;
    transition: all var(--transition-base);
    position: relative;
    min-width: 56px;
}

.nav-item:hover {
    color: var(--text-secondary);
}

.nav-item.active {
    color: var(--primary);
}

.nav-item.active::before {
    content: '';
    position: absolute;
    top: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 3px;
    background: var(--primary);
    border-radius: 0 0 var(--radius-sm) var(--radius-sm);
}

.nav-item span {
    letter-spacing: 0.3px;
}

.cart-nav {
    position: relative;
}

.cart-icon-wrap {
    position: relative;
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: -20px;
    box-shadow: var(--shadow-glow);
    transition: all var(--transition-spring);
    color: white;
}

.cart-nav:hover .cart-icon-wrap {
    transform: scale(1.1);
    box-shadow: 0 6px 30px var(--primary-glow);
}

.cart-badge {
    position: absolute;
    top: -2px;
    right: -2px;
    width: 18px;
    height: 18px;
    background: var(--accent);
    color: var(--secondary);
    font-size: 0.65rem;
    font-weight: 800;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--bg-primary);
}

/* === Animations === */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* === Scroll reveal animations === */
.reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.6s ease, transform 0.6s ease;
}

.reveal.visible {
    opacity: 1;
    transform: translateY(0);
}

/* ============================================
   RESPONSIVE DESIGN
   ============================================ */

/* === Mobile (320px - 480px) === */
@media screen and (max-width: 480px) {
    :root {
        --space-lg: 16px;
        --space-xl: 24px;
        --space-2xl: 32px;
        --nav-height: 64px;
    }

    .hero-overlay {
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: var(--space-xl) var(--space-md);
        gap: var(--space-md);
        min-height: unset;
    }

    .hero-left-brand {
        max-width: 100%;
        text-align: center;
        align-items: center;
        gap: var(--space-xs);
    }

    .brand-title {
        font-size: 1.6rem;
    }

    .hero-right-card {
        width: 100%;
        max-width: 100%;
        flex-direction: column;
    }

    .hero-card-content {
        padding: var(--space-md);
    }

    .hero-card-slogan {
        font-size: 1.6rem;
    }

    .hero-card-image-wrap {
        display: none;
    }

    .category-img-wrap {
        width: 75px;
        height: 75px;
    }

    .categories-scroll {
        gap: var(--space-md);
    }

    .category-name {
        font-size: 0.8rem;
    }

    .restaurant-img-wrap {
        height: 150px;
    }

    .section-header h2 {
        font-size: 1.15rem;
    }

    .trending-card,
    .recommended-card {
        min-width: 170px;
    }

    .trending-img,
    .recommended-img {
        height: 110px;
    }

    .floating-food {
        font-size: 1.5rem;
    }

    .floating-food.food-2,
    .floating-food.food-4 {
        display: none;
    }
}

/* === Tablet Portrait (481px - 768px) === */
@media screen and (min-width: 481px) and (max-width: 768px) {
    .hero-overlay {
        flex-direction: column;
        padding: var(--space-xl) var(--space-lg);
        gap: var(--space-lg);
        min-height: unset;
    }

    .hero-left-brand {
        max-width: 100%;
        text-align: center;
        align-items: center;
        gap: var(--space-xs);
    }

    .brand-title {
        font-size: 2rem;
    }

    .hero-right-card {
        width: 100%;
        max-width: 580px;
        flex-direction: row;
    }

    .hero-card-content {
        padding: var(--space-lg);
    }

    .hero-card-slogan {
        font-size: 1.8rem;
    }

    .restaurants-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .discount-percent {
        font-size: 4.5rem;
    }

    .extra,
    .discount-label {
        font-size: 1.5rem;
    }

    .category-img-wrap {
        width: 90px;
        height: 90px;
    }

    .category-name {
        font-size: 0.85rem;
    }

    .trending-card,
    .recommended-card {
        min-width: 220px;
    }
}

/* === Tablet Landscape / Small Laptop (769px - 1024px) === */
@media screen and (min-width: 769px) and (max-width: 1024px) {
    :root {
        --space-lg: 28px;
        --space-xl: 40px;
    }

    .hero-section {
        margin: var(--space-md) var(--space-xl) var(--space-xl);
        border-radius: var(--radius-xl);
    }
    .hero-left-brand {
        max-width: 38%;
    }
    .hero-right-card {
        max-width: 600px;
        width: 58%;
        flex-shrink: 1;
    }
    .brand-title {
        font-size: 2.2rem;
    }
    .hero-card-slogan {
        font-size: 1.8rem;
    }

    .restaurants-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: var(--space-lg);
    }

    .restaurant-img-wrap {
        height: 200px;
    }

    .category-img-wrap {
        width: 100px;
        height: 100px;
    }

    .category-name {
        font-size: 0.9rem;
    }

    .categories-scroll {
        gap: var(--space-xl);
    }

    .trending-card,
    .recommended-card {
        min-width: 240px;
    }

    .trending-img,
    .recommended-img {
        height: 150px;
    }

    .search-bar {
        padding: 14px var(--space-lg);
    }
}

/* === Desktop / Large Laptop (1025px+) === */
@media screen and (min-width: 1025px) {
    :root {
        --space-lg: 32px;
        --space-xl: 48px;
        --space-2xl: 64px;
        --header-height: 68px;
        --nav-height: 78px;
    }

    .app-container {
        padding: var(--header-height) var(--space-md) 0;
    }

    .top-bar {
        border-radius: 0 0 var(--radius-lg) var(--radius-lg);
        padding: var(--space-md) var(--space-xl);
    }

    .hero-section {
        margin: var(--space-md) var(--space-xl) var(--space-xl);
        border-radius: var(--radius-xl);
    }
    .hero-left-brand {
        max-width: 38%;
    }
    .hero-right-card {
        max-width: 680px;
        width: 58%;
        flex-shrink: 1;
    }

    .search-section {
        padding: 0 var(--space-xl);
        margin-top: 0;
    }

    .search-bar {
        padding: 16px var(--space-xl);
        border-radius: var(--radius-xl);
    }

    .search-bar input {
        font-size: 1rem;
    }

    .filter-btn {
        width: 56px;
        height: 56px;
    }

    .section-header {
        padding: 0 var(--space-xl);
    }

    .section-header h2 {
        font-size: 1.5rem;
    }

    .categories-scroll {
        padding: var(--space-sm) var(--space-xl);
        gap: var(--space-xl);
        justify-content: flex-start;
    }

    .category-card {
        min-width: 125px;
    }

    .category-img-wrap {
        width: 115px;
        height: 115px;
    }

    .category-name {
        font-size: 0.95rem;
    }

    .restaurants-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: var(--space-lg);
        padding: 0 var(--space-xl);
    }

    .restaurant-img-wrap {
        height: 200px;
    }

    .trending-scroll {
        padding: var(--space-sm) var(--space-xl);
        gap: var(--space-lg);
    }

    .trending-card,
    .recommended-card {
        min-width: 260px;
    }

    .trending-img,
    .recommended-img {
        height: 160px;
    }

    .top-bar {
        display: none;
    }

    .bottom-nav {
        position: fixed;
        top: 0;
        bottom: auto;
        left: 50%;
        transform: translateX(-50%) !important;
        width: 100%;
        max-width: var(--max-width);
        height: var(--header-height);
        background: var(--bg-glass);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border-top: none;
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 var(--space-xl);
        border-radius: 0;
        z-index: var(--z-sticky);
    }

    .bottom-nav.hidden {
        transform: translateX(-50%) translateY(-100%) !important;
    }

    .nav-brand-logo {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        cursor: pointer;
    }

    .brand-logo-icon {
        font-size: 1.8rem;
    }

    .brand-logo-text {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
    }

    .logo-name {
        font-size: 1.3rem;
        font-weight: 800;
        color: var(--text-primary);
        background: linear-gradient(135deg, var(--primary), var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .logo-tagline {
        font-size: 0.65rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .nav-items-wrapper {
        display: flex;
        width: auto;
        gap: var(--space-md);
        justify-content: center;
        align-items: center;
    }

    .nav-item {
        flex-direction: row;
        gap: var(--space-sm);
        padding: var(--space-sm) var(--space-md);
        border-radius: var(--radius-full);
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-secondary);
        min-width: auto;
        transition: all var(--transition-base);
    }

    .nav-item:hover {
        background: rgba(255, 255, 255, 0.03);
        color: var(--text-primary);
    }

    .nav-item.active {
        background: rgba(255, 107, 53, 0.1);
        color: var(--primary);
    }

    .nav-item.active::before {
        display: none;
    }

    .cart-icon-wrap {
        width: auto;
        height: auto;
        background: none;
        border-radius: 0;
        margin-top: 0;
        box-shadow: none;
        color: inherit;
        display: inline-flex;
    }

    .cart-nav:hover .cart-icon-wrap {
        transform: none;
        box-shadow: none;
    }

    .cart-badge {
        top: -8px;
        right: -8px;
        border-color: var(--bg-card);
    }

    .nav-desktop-actions {
        display: flex;
        align-items: center;
        gap: var(--space-lg);
    }

    .desktop-delivery-info {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
    }

    .desktop-delivery-info .delivery-label {
        font-size: 0.65rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .desktop-delivery-info .delivery-address {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        margin-top: 2px;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-primary);
    }

    .desktop-profile-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-glass-light);
        color: var(--text-primary);
        position: relative;
        border: 1px solid var(--border-subtle);
        transition: all var(--transition-base);
        cursor: pointer;
    }

    .desktop-profile-btn:hover {
        background: var(--bg-surface);
        transform: scale(1.05);
        border-color: var(--primary);
        color: var(--primary);
    }

    .bottom-spacer {
        display: none;
    }

    .floating-food {
        font-size: 2.5rem;
    }
}

/* === Ultra Wide (1440px+) === */
@media screen and (min-width: 1440px) {


    .hero-content {
        max-width: 50%;
    }

    .discount-percent {
        font-size: 7rem;
    }

    .restaurants-grid {
        grid-template-columns: repeat(4, 1fr);
    }
}

/* === Landscape Mobile === */
@media screen and (max-height: 500px) and (orientation: landscape) {


    .hero-content {
        padding: var(--space-md);
    }

    .discount-percent {
        font-size: 2.5rem;
    }

    .extra,
    .discount-label {
        font-size: 1rem;
    }

    .bottom-nav {
        height: 56px;
    }

    .nav-item span {
        display: none;
    }

    .cart-icon-wrap {
        width: 40px;
        height: 40px;
        margin-top: -10px;
    }

    .bottom-spacer {
        height: 72px;
    }
}

/* === Prefers Reduced Motion === */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }

    .floating-food {
        display: none;
    }
}

/* === Dark mode scrollbar for Firefox === */
@supports (scrollbar-color: auto) {
    * {
        scrollbar-color: var(--bg-surface) transparent;
        scrollbar-width: thin;
    }
}

/* === iOS Safari bottom safe area === */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
    .bottom-nav {
        padding-bottom: env(safe-area-inset-bottom);
        height: calc(var(--nav-height) + env(safe-area-inset-bottom));
    }

    .bottom-spacer {
        height: calc(var(--nav-height) + env(safe-area-inset-bottom) + var(--space-lg));
    }
}

/* === Footer Styles === */
.app-footer {
    background: var(--bg-secondary);
    border-top: 1px solid var(--border-subtle);
    padding: var(--space-2xl) 0;
    margin-top: var(--space-2xl);
    width: 100%;
}

.footer-container {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 0 var(--space-xl);
}

.footer-brand-row {
    margin-bottom: var(--space-xl);
    display: flex;
    justify-content: flex-start;
    align-items: center;
}

.footer-logo {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
}

.footer-logo .logo-icon {
    font-size: 2rem;
}

.footer-logo .logo-name {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--text-primary);
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.footer-links-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-xl);
    margin-bottom: var(--space-2xl);
    border-bottom: 1px solid var(--border-subtle);
    padding-bottom: var(--space-2xl);
}

.footer-column h3 {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: 1.5px;
    margin-bottom: var(--space-lg);
    text-transform: uppercase;
}

.footer-column ul {
    list-style: none;
    padding: 0;
}

.footer-column ul li {
    margin-bottom: var(--space-sm);
}

.footer-column ul li a {
    font-size: 0.9rem;
    color: var(--text-secondary);
    transition: all var(--transition-fast);
}

.footer-column ul li a:hover {
    color: var(--primary);
    padding-left: 2px;
}

.social-column {
    display: flex;
    flex-direction: column;
}

.social-icons {
    display: flex;
    gap: var(--space-sm);
    margin-bottom: var(--space-lg);
}

.social-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--text-primary);
    color: var(--bg-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition-base);
}

.social-icon:hover {
    background: var(--primary);
    color: white;
    transform: translateY(-2px);
}

.app-download-badges {
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
    max-width: 160px;
}

.download-badge {
    background: #0F0906; /* dark app store pill */
    border: 1px solid #231710;
    border-radius: var(--radius-sm);
    padding: 6px 12px;
    color: white;
    display: flex;
    align-items: center;
    transition: all var(--transition-base);
}

.download-badge:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
    border-color: var(--border-active);
}

.download-badge .badge-content {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    width: 100%;
}

.download-badge svg {
    color: white;
    flex-shrink: 0;
}

.badge-text {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
}

.download-subText {
    font-size: 0.55rem;
    text-transform: uppercase;
    color: #8C7560;
}

.download-mainText {
    font-size: 0.8rem;
    font-weight: 700;
}

.footer-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.footer-bottom .copyright {
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.5;
}

/* Responsive Footer overrides */
@media screen and (max-width: 768px) {
    .footer-links-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: var(--space-lg);
    }
}

@media screen and (max-width: 480px) {
    .footer-links-grid {
        grid-template-columns: 1fr;
        gap: var(--space-lg);
    }
    
    .app-download-badges {
        flex-direction: row;
        max-width: 100%;
    }
    
    .download-badge {
        flex: 1;
    }
}

/* === Veg/Non-Veg Toggle === */
.veg-toggle-group {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
}

.veg-toggle-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: var(--radius-full);
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-secondary);
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    transition: all var(--transition-base);
    white-space: nowrap;
    box-shadow: var(--shadow-sm);
}

.veg-toggle-btn.active {
    border-color: #2E7D32;
    color: #2E7D32;
    background: rgba(46, 125, 50, 0.08);
}

.veg-toggle-btn#vegToggleAll.active {
    border-color: var(--primary);
    color: var(--primary);
    background: rgba(255, 107, 53, 0.08);
}

.veg-dot {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    border: 2px solid;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.veg-dot::after {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: block;
}

.veg-dot-red {
    border-color: #C62828;
}

.veg-dot-red::after {
    background: #C62828;
}

.veg-dot-green {
    border-color: #2E7D32;
}

.veg-dot-green::after {
    background: #2E7D32;
}

body.modal-open {
    overflow: hidden;
}

/* === Modal Styles === */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(5px);
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    padding: var(--space-lg);
    opacity: 0;
    transition: opacity 0.3s ease;
}

.modal-overlay.active {
    display: flex;
    opacity: 1;
}

.modal-container {
    background: var(--bg-card);
    border-radius: var(--radius-xl);
    width: 100%;
    max-height: 85vh;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.25);
    border: 1px solid var(--border-subtle);
    transform: translateY(30px);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.modal-overlay.active .modal-container {
    transform: translateY(0);
}

.filter-modal {
    max-width: 650px;
}

.signin-modal {
    max-width: 440px;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(25px) saturate(190%);
    -webkit-backdrop-filter: blur(25px) saturate(190%);
    border: 1px solid rgba(255, 255, 255, 0.45);
    border-radius: 24px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.28);
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    overflow-y: auto !important; /* Allow scrollbars on small screens */
}

.modal-header-tabs {
    display: flex;
    background: rgba(0, 0, 0, 0.03);
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    height: 60px;
    align-items: stretch;
    position: relative;
}

.modal-tab-btn {
    flex: 1;
    border: none;
    background: none;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text-muted);
    cursor: pointer;
    transition: all var(--transition-fast);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
}

.modal-tab-btn:hover {
    color: var(--text-primary);
}

.modal-tab-btn.active {
    color: var(--text-primary);
    background: transparent;
    border-bottom: 3px solid var(--primary);
}

.modal-close-btn {
    position: absolute;
    top: 50%;
    right: 16px;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.05);
    border: none;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-secondary);
    transition: all var(--transition-fast);
    z-index: 5;
}

.modal-close-btn:hover {
    background: rgba(0, 0, 0, 0.1);
    color: var(--text-primary);
}

/* Filter Modal Body */
.filter-body {
    display: flex;
    min-height: 320px;
}

.filter-sidebar {
    width: 190px;
    border-right: 1px solid var(--border-subtle);
    background: var(--bg-secondary);
    flex-shrink: 0;
}

.filter-tab {
    display: flex;
    flex-direction: column;
    width: 100%;
    padding: var(--space-md) var(--space-lg);
    text-align: left;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text-secondary);
    border-left: 4px solid transparent;
    background: none;
    transition: all var(--transition-fast);
}

.filter-tab:hover {
    background: var(--bg-card-hover);
}

.filter-tab.active {
    color: var(--text-primary);
    border-left-color: var(--primary);
    background: var(--bg-card);
}

.filter-tab-value {
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--primary);
    margin-top: 2px;
}

.filter-content {
    flex: 1;
    padding: var(--space-lg) var(--space-xl);
    overflow-y: auto;
    background: var(--bg-card);
}

.filter-panel {
    display: none;
    flex-direction: column;
    gap: var(--space-md);
}

.filter-panel.active {
    display: flex;
}

.filter-radio,
.filter-checkbox {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    cursor: pointer;
    font-size: 0.95rem;
    color: var(--text-primary);
    padding: var(--space-xs) 0;
}

.filter-radio input,
.filter-checkbox input {
    display: none;
}

.radio-custom {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all var(--transition-fast);
}

.filter-radio input:checked + .radio-custom {
    border-color: var(--primary);
}

.filter-radio input:checked + .radio-custom::after {
    content: '';
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--primary);
}

.checkbox-custom {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    border: 2px solid var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all var(--transition-fast);
}

.filter-checkbox input:checked + .checkbox-custom {
    background: var(--primary);
    border-color: var(--primary);
}

.filter-checkbox input:checked + .checkbox-custom::after {
    content: '✓';
    color: white;
    font-size: 0.8rem;
    font-weight: 900;
}

.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: var(--space-md);
    padding: var(--space-md) var(--space-xl);
    border-top: 1px solid var(--border-subtle);
    background: var(--bg-card);
}

.modal-btn-secondary {
    padding: 10px 24px;
    border-radius: var(--radius-md);
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-secondary);
    background: none;
    transition: all var(--transition-fast);
}

.modal-btn-secondary:hover {
    color: var(--text-primary);
}

.modal-btn-primary {
    padding: 10px 32px;
    border-radius: var(--radius-md);
    background: var(--primary);
    color: white;
    font-size: 0.95rem;
    font-weight: 700;
    transition: all var(--transition-base);
    box-shadow: var(--shadow-sm);
}

.modal-btn-primary:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
}

/* Sign In Modal Body */
.signin-body {
    padding: var(--space-xl);
    display: flex;
    flex-direction: column;
    gap: var(--space-lg);
}

.signin-field input {
    width: 100%;
    padding: 14px var(--space-lg);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    font-size: 1rem;
    color: var(--text-primary);
    background: var(--bg-card);
    transition: border-color var(--transition-fast);
}

.signin-field input:focus {
    border-color: var(--border-active);
    box-shadow: 0 0 0 3px var(--primary-glow);
}

.signin-field input::placeholder {
    color: var(--text-muted);
}

.signin-terms {
    display: flex;
    align-items: flex-start;
    gap: var(--space-sm);
    font-size: 0.85rem;
    color: var(--text-secondary);
    cursor: pointer;
}

.signin-terms input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin-top: 2px;
    accent-color: var(--primary);
    flex-shrink: 0;
}

.signin-terms a {
    color: var(--primary);
    font-weight: 600;
}

.signin-submit {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius-md);
    background: var(--bg-surface);
    color: var(--text-muted);
    font-size: 1rem;
    font-weight: 700;
    transition: all var(--transition-base);
    border: 1px solid var(--border-subtle);
}

.signin-submit.enabled {
    background: var(--primary);
    color: white;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
}

.signin-submit.enabled:hover {
    background: var(--primary-dark);
    box-shadow: var(--shadow-md);
}

.signin-divider {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    color: var(--text-muted);
    font-size: 0.85rem;
}

.signin-divider::before,
.signin-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-subtle);
}

.signin-google {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-sm);
    padding: 12px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-primary);
    background: var(--bg-card);
    transition: all var(--transition-fast);
}

.signin-google:hover {
    border-color: var(--border-active);
    background: var(--bg-card-hover);
}

.signin-google svg {
    flex-shrink: 0;
}

.signin-footer-text {
    text-align: center;
    font-size: 0.9rem;
    color: var(--text-secondary);
}

.signin-footer-text .login-link {
    color: var(--primary);
    font-weight: 700;
}

@media screen and (max-width: 580px) {
    .filter-body {
        flex-direction: column;
        min-height: auto;
    }
    .filter-sidebar {
        width: 100%;
        display: flex;
        overflow-x: auto;
        border-right: none;
        border-bottom: 1px solid var(--border-subtle);
    }
    .filter-tab {
        padding: var(--space-sm) var(--space-md);
        border-left: none;
        border-bottom: 3px solid transparent;
        white-space: nowrap;
        width: auto;
        align-items: center;
    }
    .filter-tab.active {
        border-bottom-color: var(--primary);
    }
    .veg-toggle-group {
        display: none;
    }
}

/* === Focus visible for keyboard navigation === */
button:focus-visible,
input:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
}

/* === Print styles === */
@media print {
    .bottom-nav,
    .splash-loader,
    .hero-video-container video {
        display: none !important;
    }

    body {
        background: white;
        color: black;
    }
}

/* === Food Detail Modal Styling === */
.food-detail-modal {
    max-width: 500px;
    border-radius: var(--radius-lg);
    overflow: hidden;
}

.food-detail-body {
    padding: var(--space-xl);
    max-height: calc(85vh - 70px);
    overflow-y: auto;
}

.food-detail-img-container {
    width: 100%;
    height: 240px;
    border-radius: var(--radius-md);
    overflow: hidden;
    margin-bottom: var(--space-lg);
    border: 1px solid var(--border-subtle);
    box-shadow: var(--shadow-sm);
}

.food-detail-img-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.food-detail-content {
    display: flex;
    flex-direction: column;
    gap: var(--space-md);
}

.food-detail-price-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.food-detail-price {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--primary);
}

.food-detail-desc {
    font-size: 0.95rem;
    color: var(--text-secondary);
    line-height: 1.6;
}

.food-detail-ingredients-section h3 {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: var(--space-sm);
    color: var(--text-primary);
}

.ingredients-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.ingredient-pill {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    padding: 6px 12px;
    border-radius: var(--radius-pill);
    font-size: 0.8rem;
    font-weight: 500;
    transition: all var(--transition-fast);
}

.ingredient-pill:hover {
    background: var(--primary-light);
    border-color: var(--primary);
    color: var(--primary);
    transform: translateY(-1px);
}

/* Menu Quantity Selector & ADD button styling for Homepage Modal */
.modal-action-container .dish-add-btn {
    position: static;
    transform: none;
    background: #fff;
    color: #25C578;
    border: 1.5px solid #25C578;
    padding: 6px 20px;
    border-radius: var(--radius-sm);
    font-weight: 700;
    font-size: 0.85rem;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    cursor: pointer;
    transition: all var(--transition-fast);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.modal-action-container .dish-add-btn:hover {
    background: #25C578;
    color: #fff;
    box-shadow: 0 4px 15px rgba(37, 197, 120, 0.3);
}

.modal-action-container .menu-qty-selector {
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border: 1.5px solid #25C578;
    border-radius: var(--radius-sm);
    padding: 0 8px;
    height: 34px;
    min-width: 80px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    box-sizing: border-box;
    transition: all var(--transition-fast);
}

.modal-action-container .menu-qty-btn {
    background: none;
    border: none;
    color: #25C578;
    font-size: 1.1rem;
    font-weight: 800;
    cursor: pointer;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform var(--transition-fast);
}

.modal-action-container .menu-qty-btn:active {
    transform: scale(0.85);
}

.modal-action-container .menu-qty-value {
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--text-primary);
    min-width: 16px;
    text-align: center;
}

/* Homepage Cards Quantity Selector Style overrides */
.homepage-qty-container .dish-add-btn {
    position: static;
    transform: none;
    background: #fff;
    color: #25C578;
    border: 1.5px solid #25C578;
    padding: 4px 14px;
    border-radius: var(--radius-sm);
    font-weight: 700;
    font-size: 0.75rem;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    cursor: pointer;
    transition: all var(--transition-fast);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.homepage-qty-container .dish-add-btn:hover {
    background: #25C578;
    color: #fff;
    box-shadow: 0 4px 10px rgba(37, 197, 120, 0.2);
}

.homepage-qty-container .menu-qty-selector {
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border: 1.5px solid #25C578;
    border-radius: var(--radius-sm);
    padding: 0 6px;
    height: 28px;
    min-width: 70px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    box-sizing: border-box;
    transition: all var(--transition-fast);
}

.homepage-qty-container .menu-qty-btn {
    background: none;
    border: none;
    color: #25C578;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform var(--transition-fast);
}

.homepage-qty-container .menu-qty-btn:active {
    transform: scale(0.85);
}

.homepage-qty-container .menu-qty-value {
    font-size: 0.75rem;
    font-weight: 800;
    color: var(--text-primary);
    min-width: 12px;
    text-align: center;
}

/* === Autocomplete Search Suggestions Dropdown === */
.search-suggest-dropdown {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    z-index: 200;
    max-height: 350px;
    overflow-y: auto;
    display: none;
    flex-direction: column;
    padding: var(--space-sm) 0;
}

.search-suggest-dropdown.active {
    display: flex;
}

.suggest-item {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-md) var(--space-lg);
    cursor: pointer;
    transition: background var(--transition-fast);
    text-align: left;
    width: 100%;
    background: none;
    border: none;
    font-family: inherit;
    color: var(--text-primary);
}

.suggest-item:hover {
    background: var(--bg-card-hover);
}

.suggest-img {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
}

.suggest-info {
    display: flex;
    flex-direction: column;
    flex: 1;
}

.suggest-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-primary);
}

.suggest-subtitle {
    font-size: 0.75rem;
    color: var(--text-muted);
}

/* === Search Results Overlay === */
.search-results-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--bg-surface);
    z-index: 450;
    display: none;
    opacity: 0;
    transition: opacity 0.3s ease;
    overflow-y: auto;
}

.search-results-overlay.active {
    display: block;
    opacity: 1;
}

.search-results-container {
    max-width: 800px;
    margin: 0 auto;
    padding: var(--space-md);
    box-sizing: border-box;
}

.search-results-header {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-md) 0;
    border-bottom: 1px solid var(--border-subtle);
}

.search-results-back-btn {
    background: none;
    border: none;
    color: var(--text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-sm);
    border-radius: 50%;
    transition: background var(--transition-fast);
}

.search-results-back-btn:hover {
    background: var(--bg-card-hover);
}

.search-results-title {
    display: flex;
    flex-direction: column;
    text-align: left;
}

.search-results-title span {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.search-results-title strong {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--text-primary);
}

/* Search Tabs */
.search-results-tabs {
    display: flex;
    border-bottom: 1px solid var(--border-subtle);
    margin-bottom: var(--space-lg);
}

.search-results-tab {
    flex: 1;
    background: none;
    border: none;
    padding: var(--space-md) 0;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    position: relative;
    transition: color var(--transition-fast);
}

.search-results-tab.active {
    color: var(--text-primary);
    font-weight: 700;
}

.search-results-tab.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 100%;
    height: 3px;
    background: var(--primary);
}

/* Tab Panels */
.search-results-panel {
    display: none;
    flex-direction: column;
    gap: var(--space-lg);
    padding-bottom: var(--space-2xl);
}

.search-results-panel.active {
    display: flex;
}

/* --- Tab: Restaurants Results Layout (Image 2) --- */
.search-res-card {
    display: flex;
    background: var(--bg-card);
    border-radius: var(--radius-xl);
    border: 1px solid var(--border-subtle);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: all var(--transition-base);
}

.search-res-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
}

.search-res-img-wrap {
    width: 180px;
    height: 140px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
}

.search-res-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.search-res-offer-tag {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 20px 8px 6px;
    font-size: 0.85rem;
    font-weight: 900;
    color: #fff;
    background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%);
    box-sizing: border-box;
}

.search-res-info {
    padding: var(--space-md) var(--space-lg);
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 1;
    text-align: left;
}

.search-res-info h3 {
    font-size: 1.15rem;
    font-weight: 800;
    margin: 0 0 var(--space-xs) 0;
}

.search-res-rating-row {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: var(--space-xs);
}

.search-res-rating-row .star-badge {
    background: #2E7D32;
    color: white;
    padding: 2px 6px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    gap: 2px;
}

.search-res-meta {
    font-size: 0.8rem;
    color: var(--text-muted);
}

/* --- Tab: Dishes Results Layout (Image 1) --- */
.search-dish-restaurant-group {
    background: var(--bg-card);
    border-radius: var(--radius-xl);
    border: 1px solid var(--border-subtle);
    padding: var(--space-lg);
    display: flex;
    flex-direction: column;
    gap: var(--space-md);
    box-shadow: var(--shadow-sm);
    text-align: left;
}

.search-dish-group-header {
    border-bottom: 1px dashed var(--border-subtle);
    padding-bottom: var(--space-sm);
}

.search-dish-group-header h3 {
    font-size: 1.2rem;
    font-weight: 800;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.search-dish-group-rating {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-top: 4px;
}

.search-dish-group-rating .star {
    color: #2E7D32;
    font-weight: 700;
}

.search-dish-group-offer {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--primary);
    margin-top: 4px;
}

.search-dish-list-scroll {
    display: flex;
    gap: var(--space-md);
    overflow-x: auto;
    padding: var(--space-xs) 0 var(--space-md);
    scrollbar-width: none;
}

.search-dish-list-scroll::-webkit-scrollbar {
    display: none;
}

.search-dish-result-card {
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    background: var(--bg-surface);
    padding: var(--space-md);
    width: 250px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    box-sizing: border-box;
    gap: var(--space-md);
}

.search-dish-details {
    display: flex;
    flex-direction: column;
    flex: 1;
}

.search-dish-diet-icon {
    width: 14px;
    height: 14px;
    border: 1.5px solid;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 2px;
}

.search-dish-diet-icon::after {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
}

.search-dish-diet-icon.veg {
    border-color: #2E7D32;
}

.search-dish-diet-icon.veg::after {
    background: #2E7D32;
}

.search-dish-diet-icon.nonveg {
    border-color: #C62828;
}

.search-dish-diet-icon.nonveg::after {
    background: #C62828;
}

.search-dish-result-card h4 {
    font-size: 0.95rem;
    font-weight: 700;
    margin: var(--space-xs) 0 4px;
}

.search-dish-rating {
    font-size: 0.75rem;
    font-weight: 700;
    color: #2E7D32;
    display: flex;
    align-items: center;
    gap: 2px;
    margin-bottom: var(--space-sm);
}

.search-dish-price {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-primary);
}

.search-dish-img {
    width: 85px;
    height: 85px;
    border-radius: var(--radius-md);
    object-fit: cover;
    flex-shrink: 0;
}

/* === Veg/Non-Veg Dietary Indicators (Swiggy/Zomato Style) === */
.dish-diet-icon {
    display: inline-flex;
    margin-bottom: 6px;
    vertical-align: middle;
}

.diet-indicator-box {
    width: 15px;
    height: 15px;
    border: 2px solid currentColor;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    background: transparent;
    padding: 2px;
}

/* Green dot for Veg */
.dish-diet-icon[title="Veg Only"] .diet-indicator-box {
    color: #0F8A5F !important; /* Swiggy green */
}
.dish-diet-icon[title="Veg Only"] .diet-indicator-dot {
    width: 7px;
    height: 7px;
    background-color: #0F8A5F;
    border-radius: 50%;
    display: block;
}

/* Red triangle for Non-Veg */
.dish-diet-icon[title="Non-Veg"] .diet-indicator-box {
    color: #E23744 !important; /* Swiggy non-veg red */
}
.dish-diet-icon[title="Non-Veg"] .diet-indicator-triangle {
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-bottom: 8px solid #E23744;
    display: block;
}

/* === Replace Cart Confirmation Modal === */
.replace-cart-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(5px);
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-md);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

.replace-cart-overlay.active {
    opacity: 1;
    pointer-events: auto;
}

.replace-cart-modal {
    background: var(--bg-card);
    border-radius: var(--radius-xl);
    padding: var(--space-xl);
    max-width: 420px;
    width: 100%;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    text-align: center;
    transform: translateY(20px);
    transition: transform 0.3s ease;
}

.replace-cart-overlay.active .replace-cart-modal {
    transform: translateY(0);
}

.replace-cart-title {
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--text-primary);
    margin-bottom: var(--space-md);
}

.replace-cart-desc {
    font-size: 0.95rem;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-bottom: var(--space-xl);
}

.replace-cart-actions {
    display: flex;
    gap: var(--space-md);
    justify-content: center;
}

.replace-cart-buttons {
    display: flex;
    gap: var(--space-md);
    justify-content: center;
}

.replace-cart-btn {
    padding: 12px 24px;
    border-radius: var(--radius-md);
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all var(--transition-base);
}

.replace-cart-btn.cancel {
    background: var(--bg-secondary);
    color: var(--text-secondary);
    border: 1px solid var(--border-subtle);
}

.replace-cart-btn.cancel:hover {
    background: var(--bg-card-hover);
    color: var(--text-primary);
}

.replace-cart-btn.confirm {
    background: var(--primary);
    color: white;
    border: none;
}

.replace-cart-btn.confirm:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
}

/* === Veg/Non-Veg Diet Indicators & Badges === */
.diet-indicator {
    display: inline-flex;
    width: 14px;
    height: 14px;
    border: 1.5px solid currentColor;
    border-radius: 3px;
    align-items: center;
    justify-content: center;
    padding: 2px;
    box-sizing: border-box;
    margin-bottom: var(--space-xs);
    flex-shrink: 0;
}

.diet-indicator.veg {
    color: #0F8A5F;
}

.diet-indicator.veg .diet-dot {
    width: 6px;
    height: 6px;
    background-color: #0F8A5F;
    border-radius: 50%;
    display: block;
}

.diet-indicator.non-veg {
    color: #E23744;
}

.diet-indicator.non-veg .diet-dot {
    width: 0;
    height: 0;
    border-left: 3.5px solid transparent;
    border-right: 3.5px solid transparent;
    border-bottom: 7px solid #E23744;
    display: block;
}

/* Pure Veg Tag for Restaurants */
.pure-veg-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #0F8A5F;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
    padding: 2px 0;
}

.pure-veg-dot {
    width: 12px;
    height: 12px;
    border: 1.5px solid #0F8A5F;
    border-radius: 2px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    flex-shrink: 0;
}

.pure-veg-dot::after {
    content: '';
    width: 5px;
    height: 5px;
    background-color: #0F8A5F;
    border-radius: 50%;
    display: block;
}

/* === Swiggy/Zomato Sign-in Modal Inner Fields === */
.signin-modal .brand-identity {
    text-align: center;
    padding: var(--space-lg) var(--space-xl) var(--space-xs);
}

.signin-modal .brand-logo-img {
    font-size: 2.2rem;
    display: inline-block;
    margin-bottom: 6px;
    filter: drop-shadow(0 4px 6px rgba(255, 107, 53, 0.25));
}

.signin-modal .brand-identity h1 {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.5px;
    margin-bottom: 2px;
}

.signin-modal .brand-identity p {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
}

.signin-modal .form-content-body {
    padding: 0 var(--space-xl) var(--space-xl);
}

.signin-modal .input-field-wrapper {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: var(--space-md);
}

.signin-modal .input-field-wrapper label {
    font-size: 0.82rem;
    font-weight: 800;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.signin-modal .input-field-wrapper input {
    width: 100%;
    padding: 12px var(--space-md);
    background: rgba(0, 0, 0, 0.03);
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-size: 0.95rem;
    font-family: inherit;
    transition: all var(--transition-fast);
}

.signin-modal .input-field-wrapper input:focus {
    border-color: var(--primary);
    background: white;
    box-shadow: 0 0 0 3px var(--primary-glow);
    outline: none;
}

.signin-modal .input-field-wrapper input::placeholder {
    color: var(--text-muted);
    opacity: 0.65;
}

.signin-modal .terms-selection {
